<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Montes de Oca: Offroad Stories</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0f14;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #render-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        outline: none;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        padding: 10px 12px;
        min-width: 208px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        background: rgba(8, 12, 18, 0.72);
        color: #d7e2ee;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre;
        pointer-events: none;
        backdrop-filter: blur(4px);
      }
      #hud .hud-error {
        color: #ff8f8f;
      }
      #controls {
        position: fixed;
        bottom: 12px;
        left: 12px;
        z-index: 10;
        color: rgba(215, 226, 238, 0.72);
        font-size: 11px;
        line-height: 1.5;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="render-canvas" tabindex="0"></canvas>
    <div id="hud" role="status" aria-live="polite">Cargando terreno…</div>
    <div id="controls">
      WASD/flechas: mover · Mouse: mirar · Clic en el canvas para capturar el puntero · Shift: acelerar
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
